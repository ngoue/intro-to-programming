<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Engine</title>

    <!-- This tells the browser where to find Three.js (a 3D graphics library) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
      }
    </script>

    <!-- Favicon: planet horizon logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Ccircle cx='26' cy='30' r='18' fill='%230a1a3a'/%3E%3Cpath d='M 8 30 A 18 18 0 0 1 44 30' fill='none' stroke='%234488ff' stroke-width='2.5'/%3E%3Ccircle cx='26' cy='27' r='5' fill='%23ffdd66'/%3E%3Ccircle cx='26' cy='27' r='8' fill='none' stroke='%23ffaa22' stroke-width='1' opacity='.5'/%3E%3Cpath d='M 8 30 Q 14 26 20 29 Q 26 28 36 29 Q 40 31 44 30 A 18 18 0 0 1 8 30 Z' fill='%230d2244'/%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The canvas is where Three.js draws all the 3D graphics -->
    <canvas id="solarCanvas"></canvas>

    <!-- HUD = Heads-Up Display, like the info panel in a cockpit -->
    <div id="hud">
      <div id="hud-speed">Speed: 0 u/s</div>
      <div id="hud-mode">Mode: FREE</div>
      <div id="hud-nearest">Near: Sun</div>
      <div id="hud-ship">Ship: Press F to spawn</div>
    </div>

    <!-- Crosshair in the center of the screen -->
    <div id="crosshair">+</div>

    <!-- Search panel — hidden until you press / -->
    <div id="searchPanel" style="display:none;">
      <input id="searchInput" type="text" placeholder="Search planets &amp; moons..." autocomplete="off" />
      <div id="searchResults"></div>
    </div>

    <!-- Record button in the bottom right -->
    <button id="recordBtn" title="Record video">&#9679; REC</button>

    <!-- Controls hint at the bottom, fades out -->
    <div id="controlsHint">
      WASD = move &nbsp;|&nbsp; Mouse = look &nbsp;|&nbsp; Wheel = speed &nbsp;|&nbsp;
      1 = Free &nbsp;|&nbsp; 2 = Gravity &nbsp;|&nbsp; F = Ship &nbsp;|&nbsp;
      / = Search &nbsp;|&nbsp; M = Music
    </div>

    <!-- Blocker overlay — click it to start exploring -->
    <div id="blocker">
      <div id="blockerContent">
        <h1><svg width="52" height="52" viewBox="0 0 52 52" style="vertical-align:middle;margin-right:10px" xmlns="http://www.w3.org/2000/svg">
          <!-- Planet body -->
          <circle cx="26" cy="30" r="18" fill="#0a1a3a"/>
          <!-- Atmosphere glow around the top -->
          <path d="M 8 30 A 18 18 0 0 1 44 30" fill="none" stroke="#4488ff" stroke-width="2.5" opacity="0.7"/>
          <!-- Horizon: bright rim light -->
          <path d="M 10 27 A 18 18 0 0 1 42 27" fill="none" stroke="#88ccff" stroke-width="1.5" opacity="0.9"/>
          <!-- Sun peeking over the horizon -->
          <circle cx="26" cy="27" r="5" fill="#ffdd66" opacity="0.95"/>
          <circle cx="26" cy="27" r="8" fill="none" stroke="#ffaa22" stroke-width="1" opacity="0.5"/>
          <!-- Surface terrain silhouette -->
          <path d="M 8 30 Q 14 26 20 29 Q 24 31 26 28 Q 30 24 36 29 Q 40 31 44 30 A 18 18 0 0 1 8 30 Z" fill="#0d2244"/>
          <!-- Stars in sky -->
          <circle cx="14" cy="14" r="0.8" fill="white" opacity="0.8"/>
          <circle cx="34" cy="10" r="0.6" fill="white" opacity="0.7"/>
          <circle cx="44" cy="18" r="0.7" fill="white" opacity="0.6"/>
          <circle cx="20" cy="8"  r="0.5" fill="white" opacity="0.9"/>
          <circle cx="40" cy="6"  r="0.5" fill="#aaddff" opacity="0.8"/>
        </svg>Space Engine</h1>
        <p>Click to start exploring</p>
        <p class="hint">WASD to fly &nbsp;·&nbsp; Mouse to look &nbsp;·&nbsp; Scroll to change speed</p>
      </div>
    </div>

    <!-- type="module" is required to use ES module imports in script.js -->
    <script type="module" src="script.js"></script>
  </body>
</html>
