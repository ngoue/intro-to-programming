<!doctype html>
<html lang="en">
  <head>
    <!-- This section has information about the page -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Web Page</title>

    <!-- This links our CSS file to make the page look nice -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Everything inside <body> shows up on the page -->

    <!-- A big title at the top -->
    <h1>Welcome to My Awesome Page! 🎉</h1>

    <!-- A paragraph with some text -->
    <p>Click the button below to see something cool happen!</p>

    <!-- A button that people can click -->
    <button id="magicButton" type="button">Click Me!</button>

    <!-- A div where we'll show changing content -->
    <div id="messageBox">This text will change when you click the button!</div>

    <!-- This links our JavaScript file to make the page interactive -->
    <script src="script.js"></script>
  </body>
</html>
